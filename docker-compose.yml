services:
  remove-paywall:
    build: .
    image: remove-paywall-mcp:latest
    container_name: remove-paywall-mcp
    restart: unless-stopped
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - paywall-data:/data

volumes:
  paywall-data:
