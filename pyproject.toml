[project]
name = "remove-paywall-mcp"
version = "1.3.0"
description = "MCP server that removes article paywalls via internet archives"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "RemovePaywall"},
]
keywords = ["mcp", "paywall", "archive", "wayback-machine", "claude", "opencode"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
]
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.0",
    "aiosqlite>=0.20.0",
]

[project.urls]
Repository = "https://github.com/jasval/remove-paywall-mcp"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
remove-paywall-mcp = "remove_paywall_mcp.server:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff.lint.per-file-ignores]
"src/remove_paywall_mcp/archives.py" = ["BLE001", "S112", "S110"]
"src/remove_paywall_mcp/server.py" = ["BLE001"]
"src/remove_paywall_mcp/extractors.py" = ["BLE001"]
